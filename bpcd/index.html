<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Best Photo Contest - Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
:root {
  --gold:        #FFB800;
  --gold-light:  #FFD966;
  --coral:       #FF6B35;
  --coral-light: #FF9068;
  --sky:         #4CC9F0;
  --sky-light:   #A8E6FF;
  --mint:        #06D6A0;
  --pink:        #FF6B9D;
  --purple:      #C77DFF;
  --cream:       #FFF8EE;
  --cream2:      #FFF0D6;
  --warm-white:  #FFFCF7;
  --text-dark:   #2D1B00;
  --text-mid:    #6B4A1A;
  --text-soft:   #A07840;
  --border:      #F0DDB0;
  --shadow-warm: 0 4px 20px rgba(255,107,53,0.15);
  --shadow-card: 0 2px 16px rgba(45,27,0,0.10);
  --font:        'Cairo', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  font-family: var(--font);
  background: var(--cream);
  color: var(--text-dark);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* Prevent browser from auto-mirroring FA icons in RTL */
.fa-solid, .fa-regular, .fa-brands,
[class^="fa-"], [class*=" fa-"] {
  display: inline-block;
  font-style: normal !important;
}

/* ─── Background warm texture ─── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(255,184,0,0.18) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 80%, rgba(255,107,53,0.13) 0%, transparent 50%),
    radial-gradient(ellipse at 60% 40%, rgba(255,105,157,0.08) 0%, transparent 45%);
  pointer-events: none;
}

/* ─── Floating orbs ─── */
.orb {
  position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
  animation: floatOrb 8s ease-in-out infinite;
}
.orb-1 { width: 180px; height: 180px; top: -40px; right: -40px; background: radial-gradient(circle, rgba(255,217,102,0.35), transparent 70%); animation-delay: 0s; }
.orb-2 { width: 120px; height: 120px; bottom: 10%; left: -30px; background: radial-gradient(circle, rgba(255,107,53,0.25), transparent 70%); animation-delay: -3s; }
.orb-3 { width: 90px; height: 90px; bottom: 30%; right: 5%; background: radial-gradient(circle, rgba(255,105,157,0.2), transparent 70%); animation-delay: -5s; }

@keyframes floatOrb {
  0%, 100% { transform: translateY(0) scale(1); }
  50%       { transform: translateY(-18px) scale(1.06); }
}

/* ─── SCREENS ─── */
.screen {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 28px 24px;
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.screen.hidden { opacity: 0; pointer-events: none; transform: scale(0.96); }
.screen.out    { opacity: 0; transform: scale(1.04); }

/* ─── Card ─── */
.card {
  background: var(--warm-white);
  border: 1.5px solid var(--border);
  border-radius: 28px;
  padding: 44px 28px 36px;
  width: 100%; max-width: 360px;
  box-shadow: var(--shadow-card), 0 0 0 4px rgba(255,184,0,0.08);
  position: relative; z-index: 1;
  animation: cardPop 0.55s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
@keyframes cardPop {
  from { opacity: 0; transform: translateY(30px) scale(0.94); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* Badge at top – absolutely centred, no RTL sensitivity */
.card-deco {
  position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
  width: 52px; height: 52px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--coral));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(255,107,53,0.38);
  color: #fff; font-size: 19px;
}

.question {
  font-size: clamp(22px, 6vw, 28px); font-weight: 900;
  color: var(--text-dark); text-align: center;
  line-height: 1.5; margin-top: 10px; margin-bottom: 32px;
}

/* ─── Buttons ─── */
.btn-group { display: flex; gap: 14px; justify-content: center; }

.btn {
  flex: 1; max-width: 132px;
  padding: 14px 12px; border-radius: 16px;
  border: none; cursor: pointer;
  font-family: var(--font); font-size: 17px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  position: relative; overflow: hidden;
}
/* icons inside buttons are symmetric (check / xmark) — no direction hack needed */
.btn i { font-size: 14px; flex-shrink: 0; }
.btn:active { transform: scale(0.93) !important; }

.btn-yes {
  background: linear-gradient(135deg, var(--gold), var(--coral));
  color: #fff; box-shadow: 0 4px 16px rgba(255,107,53,0.35);
}
.btn-yes:hover { box-shadow: 0 6px 22px rgba(255,107,53,0.45); transform: translateY(-2px); }

.btn-no {
  background: var(--cream2); color: var(--text-mid);
  border: 1.5px solid var(--border); box-shadow: var(--shadow-card);
}
.btn-no:hover { background: var(--cream); transform: translateY(-2px); }

.btn::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  background: rgba(255,255,255,0.28); opacity: 0; transition: opacity 0.25s;
}
.btn:active::after { opacity: 1; }

/* ─── Subtitle ─── */
.subtitle {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  font-size: 13px; color: var(--text-soft);
  margin-top: 14px; font-weight: 500;
}
.subtitle i { font-size: 12px; color: var(--coral-light); }

/* ─── TYPEWRITER SCREEN ─── */
#screen-enter .card { text-align: center; }

.typewriter-text {
  font-size: clamp(20px, 5.5vw, 26px); font-weight: 700;
  color: var(--text-mid); min-height: 3em;
  text-align: center; line-height: 1.7;
}

.cursor {
  display: inline-block; width: 2px; height: 1.1em;
  background: var(--coral); margin-right: 3px;
  vertical-align: text-bottom;
  animation: blink 0.7s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.enter-btn {
  margin-top: 28px; width: 100%; padding: 15px 20px;
  border-radius: 18px; border: none; cursor: pointer;
  font-family: var(--font); font-size: 18px; font-weight: 800;
  background: linear-gradient(135deg, var(--gold), var(--coral));
  color: #fff; box-shadow: 0 6px 22px rgba(255,107,53,0.4);
  /* force LTR inside so icon + text read left→right regardless of page RTL */
  direction: ltr;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  opacity: 0; transform: translateY(20px); pointer-events: none;
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.enter-btn.visible { opacity: 1; transform: translateY(0); pointer-events: all; }
.enter-btn:active  { transform: scale(0.95) !important; }
.enter-btn i { font-size: 16px; }

/* sparkles */
@keyframes particleFly {
  0%   { opacity: 1; transform: translate(0,0) scale(1); }
  100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
}
@keyframes sparkle {
  0%   { opacity: 1; transform: scale(0) rotate(0deg); }
  100% { opacity: 0; transform: scale(2.5) rotate(180deg); }
}
.sparkle-wrap {
  position: absolute; inset: 0; pointer-events: none;
  overflow: hidden; border-radius: inherit;
}
.sparkle-wrap span {
  position: absolute; width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold-light); animation: sparkle 0.7s ease forwards;
}

/* ─── VIDEO SCREEN ─── */
#screen-video { padding: 0; background: #1a0a00; z-index: 20; }
video { width: 100%; height: 100%; object-fit: contain; display: block; }

/* ════════════ PLAYER ════════════
   Everything inside .player-wrap is forced to LTR so that:
   - left = visual left (progress bar starts left, fills right)
   - right = visual right (fullscreen btn top-right)
   - icon directions are predictable
   Arabic text inside (time display etc.) won't appear here anyway.
*/
.player-wrap {
  position: relative; width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  direction: ltr;
}

.player-overlay {
  position: absolute; inset: 0; z-index: 5;
  display: flex; flex-direction: column; justify-content: space-between;
  pointer-events: none;
  direction: ltr;
}
.player-overlay.active { pointer-events: all; }

/* TOP: fullscreen at top-right (right in LTR = right of screen ✓) */
.player-top {
  display: flex; justify-content: flex-end;
  padding: 12px 12px 0;
}

.ctrl-btn {
  width: 40px; height: 40px; border-radius: 10px; border: none; cursor: pointer;
  background: rgba(30,10,0,0.62); color: var(--gold-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
  transition: background 0.15s, transform 0.1s;
  pointer-events: all;
}
.ctrl-btn:active { transform: scale(0.86); background: rgba(255,107,53,0.65); }

/* CENTER: back | play | forward, all centred */
.player-center {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center; gap: 22px;
  opacity: 0; transition: opacity 0.3s;
  direction: ltr;
}
.player-overlay.active .player-center { opacity: 1; }

.ctrl-big {
  width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer;
  background: rgba(30,10,0,0.62); color: var(--gold-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; position: relative;
  transition: background 0.15s, transform 0.1s;
  pointer-events: all; flex-shrink: 0;
}
.ctrl-big:active { transform: scale(0.86); }

.ctrl-big.play-btn {
  width: 66px; height: 66px; font-size: 24px;
  background: rgba(255,107,53,0.78);
  box-shadow: 0 0 22px rgba(255,107,53,0.42);
}
.ctrl-big.play-btn:active { background: rgba(255,107,53,0.96); }

/* seconds label sits below the icon inside seek buttons */
.sec-label {
  position: absolute; bottom: 10px; left: 50%;
  transform: translateX(-50%);
  font-size: 8.5px; font-weight: 800; font-family: var(--font);
  color: var(--gold-light); line-height: 1; pointer-events: none;
}
/* push icon up slightly so it doesn't overlap the label */
.ctrl-big .fa-rotate-left,
.ctrl-big .fa-rotate-right { margin-bottom: 6px; }

/* BOTTOM */
.player-bottom {
  padding: 0 12px 14px;
  display: flex; flex-direction: column; gap: 6px;
  background: linear-gradient(to top, rgba(18,5,0,0.84) 0%, transparent 100%);
  padding-top: 34px;
  direction: ltr;
}

.time-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 2px;
}
.time-txt {
  font-size: 11px; font-weight: 700; color: var(--cream2);
  font-variant-numeric: tabular-nums; font-family: var(--font);
  letter-spacing: 0.03em;
}

/* PROGRESS BAR */
.progress-wrap {
  position: relative; height: 22px;
  display: flex; align-items: center;
  cursor: pointer; pointer-events: all;
}
.progress-track {
  position: absolute; left: 0; right: 0; height: 4px;
  background: rgba(255,255,255,0.18); border-radius: 4px; overflow: visible;
}
.progress-buffer {
  position: absolute; left: 0; top: 0; height: 100%; border-radius: 4px;
  background: rgba(255,255,255,0.22); width: 0; transition: width 0.4s;
}
.progress-fill {
  position: absolute; top: 0; left: 0; height: 100%; border-radius: 4px;
  background: linear-gradient(90deg, var(--gold), var(--coral));
  width: 0; pointer-events: none;
}
.progress-thumb {
  position: absolute; top: 50%;
  transform: translate(-50%, -50%);
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--gold-light);
  box-shadow: 0 0 8px rgba(255,184,0,0.75);
  pointer-events: none; left: 0;
  transition: transform 0.15s;
}
.progress-wrap.dragging .progress-thumb,
.progress-wrap:active   .progress-thumb {
  transform: translate(-50%, -50%) scale(1.5);
}

/* THUMBNAIL PREVIEW – always anchored LTR (left = 0 of bar) */
.thumb-preview {
  position: absolute; bottom: 26px;
  transform: translateX(-50%);
  background: rgba(18,5,0,0.9);
  border: 1.5px solid rgba(240,221,176,0.3);
  border-radius: 10px; overflow: hidden;
  width: 90px; display: none;
  flex-direction: column; align-items: center;
  pointer-events: none; z-index: 10;
}
.thumb-preview.show { display: flex; }
.thumb-preview canvas { width: 90px; height: 50px; display: block; }
.thumb-time {
  font-size: 10px; font-weight: 700; color: var(--gold-light);
  padding: 3px 0; font-family: var(--font);
  font-variant-numeric: tabular-nums; line-height: 1;
}

/* tap zone + spinner */
.tap-zone { position: absolute; inset: 0; z-index: 4; cursor: pointer; }

.video-spinner {
  position: absolute; inset: 0; z-index: 6;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; opacity: 0; transition: opacity 0.3s;
}
.video-spinner.show { opacity: 1; }
.spin-ring {
  width: 46px; height: 46px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.12);
  border-top-color: var(--gold);
  animation: spin 0.75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<!-- ══════════════ SCREEN 1 ══════════════ -->
<div class="screen" id="screen-1">
  <div class="card">
    <div class="card-deco"><i class="fa-solid fa-star"></i></div>
    <div class="question">انتي رودي؟</div>
    <div class="btn-group">
      <button class="btn btn-yes" onclick="answer1('yes')">
        <i class="fa-solid fa-check"></i>اه
      </button>
      <button class="btn btn-no" onclick="answer1('no')">
        <i class="fa-solid fa-xmark"></i>لا
      </button>
    </div>
  </div>
  <p class="subtitle">
    <i class="fa-regular fa-circle-question"></i>
    أجيبي بصدق
  </p>
</div>

<!-- ══════════════ SCREEN 2 ══════════════ -->
<div class="screen hidden" id="screen-2">
  <div class="card">
    <div class="card-deco"><i class="fa-solid fa-magnifying-glass"></i></div>
    <div class="question">متأكدة إنك رودي؟</div>
    <div class="btn-group">
      <button class="btn btn-yes" onclick="answer2('yes')">
        <i class="fa-solid fa-check"></i>اه
      </button>
      <button class="btn btn-no" onclick="answer2('no')">
        <i class="fa-solid fa-xmark"></i>لا
      </button>
    </div>
  </div>
  <p class="subtitle">
    <i class="fa-regular fa-lightbulb"></i>
    فكري كويس
  </p>
</div>

<!-- ══════════════ SCREEN 3 – TYPEWRITER ══════════════ -->
<div class="screen hidden" id="screen-enter">
  <div class="card">
    <div class="card-deco"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
    <div class="typewriter-text" id="type-text"></div>
    <div class="sparkle-wrap" id="sparkle-wrap"></div>
    <!-- direction:ltr so play icon sits left of text, reading naturally -->
    <button class="enter-btn" id="enter-btn" onclick="showVideo()">
      <i class="fa-solid fa-play"></i>ادخلي
    </button>
  </div>
</div>

<!-- ══════════════ SCREEN 4 – VIDEO ══════════════ -->
<div class="screen hidden" id="screen-video">
  <div class="player-wrap" id="player-wrap">

    <video id="vid" playsinline preload="metadata" poster="./poster.jpg"></video>

    <div class="video-spinner" id="spinner"><div class="spin-ring"></div></div>

    <div class="tap-zone" id="tap-zone"></div>

    <div class="player-overlay" id="overlay">

      <!-- TOP: fullscreen top-right -->
      <div class="player-top">
        <button class="ctrl-btn" id="fs-btn">
          <i class="fa-solid fa-expand" id="fs-icon"></i>
        </button>
      </div>

      <!-- CENTER: back · play/pause · forward -->
      <div class="player-center">
        <button class="ctrl-big" id="back-btn">
          <i class="fa-solid fa-rotate-left"></i>
          <span class="sec-label">١٠</span>
        </button>
        <button class="ctrl-big play-btn" id="play-btn">
          <i class="fa-solid fa-play"  id="play-icon"></i>
          <i class="fa-solid fa-pause" id="pause-icon" style="display:none"></i>
        </button>
        <button class="ctrl-big" id="fwd-btn">
          <i class="fa-solid fa-rotate-right"></i>
          <span class="sec-label">١٠</span>
        </button>
      </div>

      <!-- BOTTOM: time · scrubber -->
      <div class="player-bottom">
        <div class="time-row">
          <span class="time-txt" id="time-current">0:00</span>
          <span class="time-txt" id="time-left">0:00</span>
        </div>
        <div class="progress-wrap" id="progress-wrap">
          <div class="progress-track">
            <div class="progress-buffer" id="prog-buffer"></div>
            <div class="progress-fill"   id="prog-fill"></div>
          </div>
          <div class="progress-thumb" id="prog-thumb"></div>
          <div class="thumb-preview"  id="thumb-preview">
            <canvas id="thumb-canvas" width="90" height="50"></canvas>
            <span class="thumb-time" id="thumb-time">0:00</span>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function fmtTime(s) {
  if (isNaN(s) || s < 0) return '0:00';
  s = Math.floor(s);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function transitionTo(fromId, toId, cb) {
  const f = $(fromId), t = $(toId);
  f.classList.add('out');
  setTimeout(() => {
    f.classList.add('hidden');
    f.classList.remove('out');
    t.classList.remove('hidden');
    cb && cb();
  }, 500);
}

/* preload while user reads screens */
const vid = $('vid');
vid.src = './video.mp4';
vid.load();

/* ── Screen 1 ── */
function answer1(a) {
  if (a === 'yes') {
    transitionTo('screen-1', 'screen-2');
  } else {
    const card = $('screen-1').querySelector('.card');
    card.style.transition = 'transform 0.08s ease';
    [12, -10, 6, -4, 0].forEach((x, i) =>
      setTimeout(() => card.style.transform = `translateX(${x}px)`, i * 80)
    );
    setTimeout(() => card.style.transition = '', 500);
  }
}

/* ── Screen 2 ── */
function answer2(a) {
  a === 'no'
    ? transitionTo('screen-2', 'screen-1')
    : transitionTo('screen-2', 'screen-enter', startTypewriter);
}

/* ── Typewriter ── */
const FULL_TEXT = 'خلاص صدقتك\nادخلي';
let typeIdx = 0, typeTimer;

function startTypewriter() {
  typeIdx = 0;
  $('type-text').innerHTML = '<span class="cursor"></span>';
  $('enter-btn').classList.remove('visible');
  typeTimer = setInterval(typeChar, 85);
}

function typeChar() {
  const box = $('type-text');
  if (typeIdx >= FULL_TEXT.length) {
    clearInterval(typeTimer);
    box.querySelector('.cursor')?.remove();
    setTimeout(() => { spawnSparkles(); $('enter-btn').classList.add('visible'); }, 320);
    return;
  }
  const ch = FULL_TEXT[typeIdx++];
  const cursor = box.querySelector('.cursor');
  if (ch === '\n') {
    const br = document.createElement('br');
    cursor ? box.insertBefore(br, cursor) : box.appendChild(br);
  } else {
    const sp = document.createElement('span');
    sp.textContent = ch;
    cursor ? box.insertBefore(sp, cursor) : box.appendChild(sp);
  }
}

function spawnSparkles() {
  const wrap   = $('sparkle-wrap');
  const colors = ['#FFB800','#FF6B35','#FF6B9D','#FFD966','#06D6A0','#C77DFF'];
  for (let i = 0; i < 22; i++) {
    const s     = document.createElement('span');
    const angle = (i / 22) * 360;
    const dist  = 45 + Math.random() * 70;
    s.style.cssText = `
      left:${48 + Math.random()*8}%; top:${58 + Math.random()*8}%;
      background:${colors[i % colors.length]};
      --tx:${Math.cos(angle * Math.PI/180) * dist}px;
      --ty:${Math.sin(angle * Math.PI/180) * dist}px;
      width:${5+Math.random()*5}px; height:${5+Math.random()*5}px;
      animation:particleFly ${0.5+Math.random()*0.45}s ease forwards;
      animation-delay:${Math.random()*0.18}s;
    `;
    wrap.appendChild(s);
    setTimeout(() => s.remove(), 1100);
  }
}

/* ── Show video ── */
function showVideo() {
  transitionTo('screen-enter', 'screen-video', initPlayer);
}

/* ════════ PLAYER ════════ */
let overlayTimer = null;
const overlay = $('overlay');

function initPlayer() {
  updateProgress();
  showControls(true);

  $('tap-zone').addEventListener('click', () =>
    overlay.classList.contains('active') ? hideControls() : showControls(true)
  );
  $('play-btn').addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
  $('back-btn').addEventListener('click', e => { e.stopPropagation(); skipBy(-10); });
  $('fwd-btn' ).addEventListener('click', e => { e.stopPropagation(); skipBy(10);  });
  $('fs-btn'  ).addEventListener('click', e => { e.stopPropagation(); toggleFS();  });

  vid.addEventListener('timeupdate', updateProgress);
  vid.addEventListener('progress',   updateBuffer);
  vid.addEventListener('waiting', () => $('spinner').classList.add('show'));
  vid.addEventListener('playing', () => $('spinner').classList.remove('show'));
  vid.addEventListener('canplay', () => $('spinner').classList.remove('show'));
  vid.addEventListener('play',    syncPlayIcon);
  vid.addEventListener('pause',   syncPlayIcon);
  vid.addEventListener('ended',   () => { syncPlayIcon(); hideControls(); });

  document.addEventListener('fullscreenchange',       syncFsIcon);
  document.addEventListener('webkitfullscreenchange', syncFsIcon);

  setupScrubber();
}

function showControls(autoHide) {
  overlay.classList.add('active');
  clearTimeout(overlayTimer);
  if (autoHide && !vid.paused)
    overlayTimer = setTimeout(hideControls, 3200);
}
function hideControls() { clearTimeout(overlayTimer); overlay.classList.remove('active'); }

function togglePlay() {
  vid.paused ? (vid.play(), showControls(true)) : (vid.pause(), showControls(false));
}
function skipBy(sec) {
  vid.currentTime = Math.max(0, Math.min(vid.duration || 0, vid.currentTime + sec));
  showControls(true);
}
function syncPlayIcon() {
  $('play-icon' ).style.display = vid.paused ? '' : 'none';
  $('pause-icon').style.display = vid.paused ? 'none' : '';
}
function toggleFS() {
  const el = $('player-wrap');
  const inFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
  inFS
    ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
    : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
}
function syncFsIcon() {
  const inFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
  $('fs-icon').className = inFS ? 'fa-solid fa-compress' : 'fa-solid fa-expand';
}

function updateProgress() {
  const dur = vid.duration || 0, cur = vid.currentTime || 0;
  const pct = dur ? (cur / dur) * 100 : 0;
  $('prog-fill' ).style.width = pct + '%';
  $('prog-thumb').style.left  = pct + '%';
  $('time-current').textContent = fmtTime(cur);
  $('time-left'   ).textContent = fmtTime(dur - cur);
}
function updateBuffer() {
  try {
    const dur = vid.duration, buf = vid.buffered;
    if (dur && buf.length)
      $('prog-buffer').style.width = ((buf.end(buf.length-1) / dur) * 100) + '%';
  } catch(_) {}
}

/* ── Scrubber ── */
function setupScrubber() {
  const wrap = $('progress-wrap');
  const ctx  = $('thumb-canvas').getContext('2d');
  let dragging = false, thumbVid = null;

  const cx = e => e.touches ? e.touches[0].clientX : e.clientX;
  const getPct = e => {
    const r = wrap.getBoundingClientRect();
    return Math.max(0, Math.min(1, (cx(e) - r.left) / r.width));
  };
  const seekTo = pct => { if (vid.duration) vid.currentTime = pct * vid.duration; };

  function showThumb(e) {
    const pct = getPct(e), r = wrap.getBoundingClientRect();
    $('thumb-preview').classList.add('show');
    $('thumb-preview').style.left = Math.max(45, Math.min(r.width - 45, pct * r.width)) + 'px';
    $('thumb-time').textContent = fmtTime(pct * (vid.duration || 0));
    renderThumb(pct);
  }
  function hideThumb() { $('thumb-preview').classList.remove('show'); }

  function renderThumb(pct) {
    if (!thumbVid) {
      thumbVid = document.createElement('video');
      thumbVid.src = vid.src; thumbVid.muted = true; thumbVid.preload = 'metadata';
    }
    const t = pct * (vid.duration || 0);
    if (Math.abs(thumbVid.currentTime - t) < 0.5) { ctx.drawImage(thumbVid, 0, 0, 90, 50); return; }
    thumbVid.currentTime = t;
    thumbVid.addEventListener('seeked', function h() {
      ctx.drawImage(thumbVid, 0, 0, 90, 50);
      thumbVid.removeEventListener('seeked', h);
    });
  }

  wrap.addEventListener('mousedown',  e => { dragging=true; wrap.classList.add('dragging'); seekTo(getPct(e)); showThumb(e); });
  document.addEventListener('mousemove', e => { if(dragging){ seekTo(getPct(e)); showThumb(e); } });
  document.addEventListener('mouseup',   () => { if(dragging){ dragging=false; wrap.classList.remove('dragging'); hideThumb(); } });
  wrap.addEventListener('mousemove',  showThumb);
  wrap.addEventListener('mouseleave', () => { if(!dragging) hideThumb(); });

  wrap.addEventListener('touchstart', e => { dragging=true; wrap.classList.add('dragging'); seekTo(getPct(e)); showThumb(e); }, {passive:true});
  document.addEventListener('touchmove', e => { if(dragging){ seekTo(getPct(e)); showThumb(e); } }, {passive:true});
  document.addEventListener('touchend',  () => { if(dragging){ dragging=false; wrap.classList.remove('dragging'); hideThumb(); } });
}
</script>
